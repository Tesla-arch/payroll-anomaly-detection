<text x="28.0" y="620.0" fill="#1F2937" font-size="13" font-family="Segoe UI, Calibri, Arial, sans-serif" font-weight="600" text-anchor="start" dominant-baseline="central">How to read this map</text>
<text x="28.0" y="646.0" fill="#1F2937" font-size="12" font-family="Segoe UI, Calibri, Arial, sans-serif" font-weight="400" text-anchor="start" dominant-baseline="central">1.  Identity is the hub: every officer, teacher, parent and auditor is a user with one role.</text>
<text x="28.0" y="666.0" fill="#1F2937" font-size="12" font-family="Segoe UI, Calibri, Arial, sans-serif" font-weight="400" text-anchor="start" dominant-baseline="central">2.  Staff is the HR master record. It may link to a user (officers) or stand alone for staff-ID login (teachers, accountants).</text>
<text x="28.0" y="686.0" fill="#1F2937" font-size="12" font-family="Segoe UI, Calibri, Arial, sans-serif" font-weight="400" text-anchor="start" dominant-baseline="central">3.  Payroll runs generate one slip per staff member and scan payroll_anomalies before Headteacher approval.</text>
<text x="28.0" y="706.0" fill="#1F2937" font-size="12" font-family="Segoe UI, Calibri, Arial, sans-serif" font-weight="400" text-anchor="start" dominant-baseline="central">4.  Primary classes have one tutor (school_classes.teacher_id). Junior High teachers are assigned per subject via staff_subject.</text>
<text x="28.0" y="726.0" fill="#1F2937" font-size="12" font-family="Segoe UI, Calibri, Arial, sans-serif" font-weight="400" text-anchor="start" dominant-baseline="central">5.  Parents (users) link to students and receive parent_messages by email and WhatsApp.</text>
<text x="1352.0" y="752.0" fill="#6B7280" font-size="11" font-family="Segoe UI, Calibri, Arial, sans-serif" font-weight="400" text-anchor="end" dominant-baseline="central">Source: Laravel migrations in backend/database/migrations · School SMS</text>
</svg>
