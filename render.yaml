databases:
  - name: payroll-db
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: web
    name: payroll-anomaly-detection
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: School Management System
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: payroll-db
          property: connectionString
      - key: DB_URL
        fromDatabase:
          name: payroll-db
          property: connectionString
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: RESET_DATABASE
        value: "false"
